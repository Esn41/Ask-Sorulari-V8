<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aşk Soruları v8 </title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">❤️</div>
    <h1>Aşk Soruları</h1>
<p>Partnerine Sorabileceğin En Güzel Sorular ❤️</p>
  </header>

  <div class="question-card">
    <div id="question">
      Soru oluşturmak için aşağıdaki butona bas ❤️
    </div>
  </div>

  <div class="controls">
    <select id="category">
      <option value="romantik">❤️ Romantik</option>
      <option value="eglenceli">😂 Eğlenceli</option>
      <option value="derin">🌙 Derin</option>
      <option value="cesur">🔥 Cesur</option>
    </select>

    <button onclick="generateQuestion()">Yeni Soru Oluştur</button>
    

    
  </div>

</div>
<button id="sideToggle" onclick="toggleSideMenu()">›</button>

<div id="sideMenu" class="side-menu">
  <button onclick="copyQuestion()">📋 Kopyala</button>
  <button onclick="randomCategory()">🎲 Rastgele</button>
  <button onclick="shareWhatsApp()">📤 WhatsApp</button>
</div>
<script src="app.js?v=17"></script>

</body>
</html>
