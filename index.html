<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aşk Soruları</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- ANA SAYFA -->
  <section id="homePage" class="page active">
    <header class="header">
      <div class="logo">❤️</div>
      <h1>Aşk Soruları</h1>
      <p>Partnerine Sorabileceğin 20.000+ Özel Soru ❤️</p>
    </header>

    <h2>Kategori Seç</h2>

    <select id="homeCategory">
      <option value="romantik">❤️ Romantik</option>
      <option value="eglenceli">😂 Eğlenceli</option>
      <option value="derin">🌙 Derin</option>
      <option value="cesur">🔥 Cesur</option>
    </select>

    <button onclick="startQuestions()">
      ❤️ Sorulara Başla
    </button>
  </section>

  <!-- SORU SAYFASI -->
  <section id="questionPage" class="page">
    <button class="back-btn" onclick="showPage('homePage')">
      ← Ana Sayfa
    </button>

    <div class="question-card big-card">
      <div id="question">
        Soru oluşturmak için aşağıdaki butona bas ❤️
      </div>
    </div>

    <div class="controls">
      <select id="category">
        <option value="romantik">❤️ Romantik</option>
        <option value="eglenceli">😂 Eğlenceli</option>
        <option value="derin">🌙 Derin</option>
        <option value="cesur">🔥 Cesur</option>
      </select>

      <button onclick="generateQuestion()">
        Yeni Soru Oluştur
      </button>
    </div>
  </section>

</div>

<button id="sideToggle" onclick="toggleSideMenu()">›</button>

<div id="sideMenu" class="side-menu">
  <button onclick="copyQuestion()">📋 Kopyala</button>
  <button onclick="randomCategory()">🎲 Rastgele</button>
  <button onclick="shareWhatsApp()">📤 WhatsApp</button>
</div>

<script src="app.js?v=23"></script>

</body>
</html>
