<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aşk Soruları</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- ANA SAYFA -->
  <section id="homePage" class="page active">
    <header class="header">
      <div class="logo">❤️</div>
      <h1>Aşk Soruları</h1>
      <p>Partnerine Sorabileceğin sorular </p>
    </header>

    <h2>Kategori Seç</h2>

    <div class="category-grid">
  <button class="category-card active" onclick="selectHomeCategory('romantik', this)">
    <span>❤️</span>
    <strong>Romantik</strong>
  </button>

  <button class="category-card" onclick="selectHomeCategory('eglenceli', this)">
    <span>😂</span>
    <strong>Eğlenceli</strong>
  </button>

  <button class="category-card" onclick="selectHomeCategory('derin', this)">
    <span>🌙</span>
    <strong>Derin</strong>
  </button>

  <button class="category-card" onclick="selectHomeCategory('cesur', this)">
    <span>🔥</span>
    <strong>Cesur</strong>
  </button>
</div>

<input type="hidden" id="homeCategory" value="romantik">

    <button class="start-btn" onclick="startQuestions()">
      ❤️ Sorulara Başla
    </button>
  </section>

  <!-- SORU SAYFASI -->
  <section id="questionPage" class="page">
    <button class="back-btn" onclick="showPage('homePage')">
      ← Ana Sayfa
    </button>

    <div class="question-card big-card">
  

  <div id="question">
        Soru oluşturmak için aşağıdaki butona bas ❤️
      </div>
    </div>

    <div class="controls">
      <select id="category">
        <option value="romantik">❤️ Romantik</option>
        <option value="eglenceli">😂 Eğlenceli</option>
        <option value="derin">🌙 Derin</option>
        <option value="cesur">🔥 Cesur</option>
      </select>

      <button onclick="generateQuestion()">
        Yeni Soru Oluştur
      </button>
    </div>
  </section>

</div>

<button id="sideToggle" onclick="toggleSideMenu()">›</button>

<div id="sideMenu" class="side-menu">
  <button onclick="copyQuestion()">📋 Kopyala</button>
  <button onclick="randomCategory()">🎲 Rastgele</button>
  <button onclick="shareWhatsApp()">📤 WhatsApp</button>
</div>

<script src="app.js?v=23"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>
</body>
</html>
